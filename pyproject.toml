[project]
name = "eidos"
version = "0.1.0"
description = "Engineering Intelligence for Deterministic, Orchestrated Software"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Bernardo Ordóñez" }]

dependencies = [
    "pydantic>=2.8.0",
    "networkx>=3.3",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
eidos = "eidos.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
